{% extends "base.html" %}
{% block title %}Phone remote &middot; {{ app_name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Phone remote</h1>
  <p class="muted">Enter the code shown in the &ldquo;Phone remote&rdquo; panel of the host console.</p>
  {% if error %}<p class="flash error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/remote">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Remote code
      <input name="code" value="{{ code }}" maxlength="12" autocapitalize="characters" autocomplete="off"
             spellcheck="false" required autofocus>
    </label>
    <button type="submit">Connect</button>
  </form>
</section>
{% endblock %}
