{% extends "base.html" %}
{% block title %}Set up &middot; {{ app_name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Create the host account</h1>
  <p class="muted">This page is only available until the first host account exists.</p>
  {% for error in errors %}<p class="flash error">{{ error }}</p>{% endfor %}
  <form method="post" action="/setup">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Username
      <input name="username" value="{{ form.get('username', '') }}" autocomplete="username" required autofocus>
    </label>
    <label>Password <span class="muted">(10+ characters)</span>
      <input type="password" name="password" autocomplete="new-password" minlength="10" required>
    </label>
    <label>Confirm password
      <input type="password" name="confirm" autocomplete="new-password" minlength="10" required>
    </label>
    <button type="submit">Create account</button>
  </form>
</section>
{% endblock %}
